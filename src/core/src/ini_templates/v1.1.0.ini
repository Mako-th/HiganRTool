; HiganRTool の設定。HiganRTool.exe と同じフォルダに置く。; か # で始まる行はコメント。
; メニューで変えた設定は、決めた時点でこのファイルの該当の行に書き込まれます。
; 知らないキーや読めない値の行は、その行だけ使わず既定値で動かします（メニューの下とログに出ます）。
; 詳しくは README.txt の「設定」。

[netplay]
; --- 通信の基本（変えない） ---
enable = 1
scope = internet
; 待ち受けの UDP ポート（ポート開放できる番号に変更して良い、相手と合わせる必要はありません）
bind = auto:17723
; UPnP（ルーターのポート開放）: on（待機中と対戦中だけ開ける）/ off（使わない）
upnp = on
code_side = game
room_server = https://higanr-rooms.higan-re-room.workers.dev
check = game
; 外から見た自分のアドレスの問い合わせ先（空にすると問い合わせない）
stun = stun.cloudflare.com:3478
stun2 = stun.l.google.com:19302
; IPv6 の使用: on（使う）/ off（使わない）
ipv6 = on

; --- メニューで変えると書き換わる（手で書き換えてもよい） ---
; プレイヤー名（相手と観戦者に見える）
name = HiganRTool
; ルーム名（最後に入った名前）
room =
; LAN のホストのアドレス（LAN の「クライアント」「観戦」で最後に打ったもの）
lan_host =
; サイド: 1（1P）/ 2（2P）。行が無いときはおまかせ
; host_seat = 1
; 同期方式: rollback（既定）/ delay
mode = rollback
; ディレイ: 0〜8 / auto（既定は auto。rollback と delay 方式で共通）
delay = auto

; rollback の被弾の音: confirmed（確定まで鳴らさない。既定）/ live（予測の時点で鳴らす）
rollback_hit_se = confirmed

[pacing]
; フレームの進め方: auto（ウィンドウ起動時はこのツールが 60.000fps を維持）/ game（花映塚自身に任せる）
mode = auto
; ウィンドウ起動時の待機方法: b-spin（常にアクティブで待機。既定）/ b-hybrid（フレームの切り替わりの直前までアイドルで待機）
; auto_window = b-hybrid

[replay]
; リプレイの自動保存: 1（保存）/ 0（保存しない）
enable = 1
; 保存先のフォルダの分け方: peer（1P vs 2P）/ date（日付）/ flat（分けない）/ pack50（50 本ずつ）
layout = peer

[spectate]
; 観戦: 1（許可）/ 0（禁止。ランダムマッチは 2 人のどちらかが 0 なら一覧に載らない）
enable = 1

; ウィンドウの大きさ・位置（全画面には効かない）。使うときは [window] と使う行の ; を外す
; [window]
; 中身の画素数
; width = 1280
; height = 960
; 左上の位置（2 つとも書いたときだけ）
; x = 100
; y = 50
; 枠とタイトルバー: 1（出す）/ 0（消す）
; titlebar = 1
; 最前面: 1（他のウィンドウより手前）/ 0（しない）
; alwaysontop = 0

[pad]
; パッドの十字キーの読み取り: 1（方向として読む）/ 0（読まない）/ always（診断用）
pov = 1

[ui]
; 画面の言語: auto（Windows の表示言語）/ ja / en（Screen language: auto / ja / en）
lang = auto

[log]
; ログの量: 0（簡潔）/ 1（詳細。調べてもらうときだけ）（Log detail: 0 brief / 1 detailed）
detail = 0

[loader]
; 花映塚の th09.exe の場所（フォルダを選ぶと書き込まれる。空のときはフォルダを選ぶ画面を出す）
game =
; 起動前の更新の確認: 1（する）/ 0（しない）
update_check = 1
