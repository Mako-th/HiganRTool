; HiganRTool の設定。HiganRTool.exe と同じフォルダに置く。; か # で始まる行はコメント。
; 知らないキーや読めない値があると、その節（[netplay] などのまとまり）を丸ごと使いません（理由はログに出る）。
; 詳しくは README.txt の「設定」。

[netplay]
; --- 通信の基本（変えない） ---
enable = 1
scope = internet
; 待ち受けの UDP ポート（ポート開放できる番号に変更して良い、相手と合わせる必要はありません）
bind = auto:17723
; ルーターの UPnP で bind のポートを開ける: on（待機中と対戦中だけ開ける）/ off（使わない）
upnp = on
code_side = game
room_server = https://higanr-rooms.higan-re-room.workers.dev
check = game
; 外から見た自分のアドレスの問い合わせ先（空にすると問い合わせない）
stun = stun.cloudflare.com:3478
stun2 = stun.l.google.com:19302
; IPv6 を使わないときは ; を外す
; ipv6 = off

; --- 自由に変えてよい ---
; 相手と観戦者に見える名前（メニューの「プレイヤー名」が優先）
name = HiganRTool
; ルーム名の初めの値（書かなければ前回の名前）
; room =
; サイドの初めの値: 1 / 2（書かなければ「おまかせ」）
; host_seat = 1

; --- 同期方式とディレイ（メニューの設定の初めの値） ---
; 同期方式: rollback（既定）/ delay
; mode = rollback
; ディレイ: 0〜8 / auto（既定は auto。rollback と delay 方式で共通）
delay = auto

; rollback の被弾の音: confirmed（確定まで鳴らさない。既定）/ live（予測の時点で鳴らす）
; rollback_hit_se = confirmed

[pacing]
; フレームの進め方: auto（ウィンドウ起動時はこのツールが 60.000fps を維持）/ game（花映塚自身に任せる）
mode = auto
; ウィンドウ起動時の CPU の待機方法: b-spin（常にアクティブで待機。既定）/ b-hybrid（フレームの切り替わりの直前までアイドルで待機）
; auto_window = b-hybrid

[replay]
; リプレイの自動保存: 1（マッチごとに保存）/ 0（しない）
enable = 1
; 保存先のフォルダの分け方: peer（1P vs 2P）/ date（日付）/ flat（分けない）/ pack50（50 本ずつ）
layout = peer

[spectate]
; 観戦の受け付け: 1（受け付ける）/ 0（断る。ランダムマッチは 2 人のどちらかが 0 なら一覧に載らない）
enable = 1

; ウィンドウの大きさ・位置（全画面には効かない）。使うときは [window] と使う行の ; を外す
; [window]
; 中身の画素数
; width = 1280
; height = 960
; 左上の位置（2 つとも書いたときだけ）
; x = 100
; y = 50
; 枠とタイトルバー: 1（出す）/ 0（消す）
; titlebar = 1
; 最前面: 1（他のウィンドウより手前）/ 0（しない）
; alwaysontop = 0

[pad]
; パッドの十字キーを方向として読む: 1（読む）/ 0（読まない）/ always（診断用）
pov = 1

[ui]
; 画面の言語: auto（Windows の表示言語）/ ja / en（Screen language: auto / ja / en）
lang = auto

[log]
; ログの量: 0（簡潔）/ 1（詳細。調べてもらうときだけ）（Log detail: 0 brief / 1 detailed）
detail = 0

; 起動前の更新の確認をやめるときは、次の 2 行の ; を外す
; [loader]
; update_check = 0
