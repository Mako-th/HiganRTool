; 設定
; メニューで変えた設定は確定時にこのファイルの該当の行へ書き込まれます。
; 知らないキーや読めない値の行は使わず既定値で動かします（メニューの下とログに出ます）。
; 詳しくはREADME.txtの「設定」を読んでください。

[netplay]
; --- 通信の基本（変えないでください） ---
; enable（ネット対戦）・scope（接続できる範囲）・code_side（接続の操作・ゲームのメニュー）・room_server（ルームサーバー）・check（同期ズレの検出）
enable = 1
scope = internet
code_side = game
room_server = https://higanr-rooms.higan-re-room.workers.dev
check = game

; --- 通信の拡張設定（必要がある場合は変更してよい） ---
; 待ち受けをするUDPポート（相手と合わせる必要はない）
bind = auto:17723
; UPnP（ルーターのポート開放機能）: on（待機中・試合中・中継する観戦中だけポートを開ける）/ off（使用しない）
upnp = on
; 外から見た自分のアドレスの問い合わせ先（空にすると問い合わせしない）
stun = stun.cloudflare.com:3478
stun2 = stun.l.google.com:19302
; IPv6の使用: on（使う）/ off（使わない）
ipv6 = on

; --- メニューで変えると書き換わる設定（手で書き換えてもよい） ---
; プレイヤー名（相手と観戦者に見える）
name = HiganRTool
; ルーム名（最後に入力した名前）
room =
; LANのホストのアドレス（LANの「クライアント」「観戦」で最後に入力したアドレス）
lan_host =
; サイドの指定: 1（1P）/ 2（2P）。行が無いときはおまかせ
; host_seat = 1
; 同期方式: rollback（既定）/ delay
mode = rollback
; ディレイ（遅延させるフレーム数・rollbackとdelayで共通）: 0〜8 / auto（既定）
delay = auto

; rollbackの被弾音: confirmed（確定まで鳴らさないが最大130msほど音が遅れる。既定）/ live（予測の時点で鳴らす）
rollback_hit_se = confirmed
; rollbackのカットイン音: confirmed（確定まで鳴らさないが最大130msほど音が遅れる。既定）/ live（予測の時点で鳴らす）
rollback_cutin_se = confirmed


[pacing]
; フレームの進め方: auto（ツール側で60.000fpsを維持、垂直同期オン/フルスクリーンの場合は花映塚のシステムを使う）/ game（花映塚のシステムを使う）
mode = auto
; 待機方法: passive（入力や描画をパッシブで待つ。既定）/ active（入力や描画をアクティブで待つ、CPU使用率が増えます。）
wait = passive
; 垂直同期（この設定はフルスクリーンでのみ有効）: off（取らない。既定）/ on（取る）/ game（custom.exeの設定に従う）
vsync = off

; リプレイの高速再生（Skip・Ctrl）: 1〜6000（fps。既定240）
replay_skip_fps = 240
; リプレイの低速再生（Slow・Shift）: 1〜1000（fps。既定30）
replay_slow_fps = 30


[replay]
; リプレイの自動保存: 1（保存）/ 0（保存しない）
enable = 1
; 保存先のフォルダの分け方: peer（1P vs 2P）/ date（日付）/ flat（分けない）/ pack50（50本ずつ）
layout = peer
; リプレイのファイル名: {num}（番号4桁）/ {date}（年月日）/ {time}（時分）/ {1Pchara}・{2Pchara}（キャラ）/ {1Pname}・{2Pname}（名前）/ {round}（ラウンド数）/ {wins}（取ったラウンド 2vs1）/ {winner}（1P・2P）
;   {length}（マッチの長さ 3m42s）/ {rlengths}（ラウンドごとの長さ）/ {rlifes}（ラウンドごとの決着のライフ 10vs0-0vs3）/ {sync}・{delay}・{ping}・{side}・{result}（win・lose・draw）
; 使えない文字（\ / : * ? " < > | と制御文字）は - に置き換え、長すぎる名前は末尾を切り捨て（目安は約80文字。上限はログに出力）
; 例: th9_ud{date}-{time}_{1Pchara}VS{2Pchara}_{round}R_{winner}win
name = th9_ud{num}

[spectate]
; 観戦: 1（許可）/ 0（禁止、片方でも0なら観戦不可）
enable = 1
; 観戦中の中継: 1（ほかの観戦者へ中継する）/ 0（中継しない）
relay = 1
; 観戦で追いつく際の早送り速度: 120〜6000（fps。既定480。通信速度によってはそこまで速くならない）
ff_fps = 480

; ウィンドウの大きさ・位置（フルスクリーンでは無効）。使うときは[window]と使う行の ; を外す
; [window]
; 中身の画素数
; width = 1280
; height = 960
; 左上の位置（x,y両方書いたときのみ有効）
; x = 100
; y = 50
; 枠とタイトルバー: 1（出す）/ 0（消す）
; titlebar = 1
; 最前面: 1（有効）/ 0（無効）
; alwaysontop = 0

[pad]
; パッド十字キーの読み取り: 1（方向キーとして読む）/ 0（読まない）/ always（診断用）
pov = 1

[input]
; 人間対人間でキーボード2台を1P・2Pに分ける: 1（有効）/ 0（無効）
split_keyboards = 1

[ui]
; 画面の言語: auto（Windowsの表示言語）/ ja / en（Screen language: auto / ja / en）
lang = auto
; 試合中の通信状態とディレイの行の位置: 1p（左下）/ 2p（右下）/ self（自分側）/ opponent（相手側）
status_side = 1p

[log]
; ログの量: 0（簡潔）/ 1（詳細、不具合の報告用）
detail = 0

[loader]
; 花映塚(th09.exe)の場所（フォルダを選ぶと自動で書き込み、空のときはフォルダを選ぶウィンドウを出す）
game =
; 更新の確認（起動前と遊んでいる間の新しいバージョンの表示）: 1（する）/ 0（しない）
update_check = 1