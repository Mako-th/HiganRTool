name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (Windows i686)
    # 公開用のリポジトリでだけ回す
    if: github.repository == 'Mako-th/HiganRTool'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc

      # 実時間の検査（#[ignore]）は含めない。
      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release --workspace

  server:
    name: Room server (Vitest)
    if: github.repository == 'Mako-th/HiganRTool'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 依存パッケージ（vitest 4 / wrangler 4）が要る Node は 20.19 か 22.12 以上。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
